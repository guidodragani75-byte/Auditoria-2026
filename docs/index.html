<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=https://script.google.com/macros/s/AKfycbzydV2LXVIQF6p7rJpVmXXKLgEOPhHBlA4fyYa5kRhPy3NYUwsVQnQ8Rz-xqINXsHoZiA/exec">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auditoría Médica 2026</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      padding: 40px 32px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      max-width: 480px;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 1.5rem;
      margin: 0 0 10px 0;
      color: #38bdf8;
      font-weight: 700;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      margin: 0 0 24px 0;
      line-height: 1.5;
    }
    .spinner {
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      width: 34px;
      height: 34px;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn {
      display: inline-block;
      background: #0284c7;
      color: #ffffff;
      padding: 12px 28px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      transition: background 0.2s, transform 0.1s;
    }
    .btn:hover {
      background: #0369a1;
      transform: translateY(-1px);
    }
  </style>
  <script>
    window.location.replace("https://script.google.com/macros/s/AKfycbzydV2LXVIQF6p7rJpVmXXKLgEOPhHBlA4fyYa5kRhPy3NYUwsVQnQ8Rz-xqINXsHoZiA/exec");
  </script>
</head>
<body>
  <div class="card">
    <div class="icon">🩺</div>
    <div class="spinner"></div>
    <h1>Auditoría Médica 2026</h1>
    <p>Redirigiendo a la plataforma en vivo... Si no abre automáticamente en segundos, haz clic aquí:</p>
    <a href="https://script.google.com/macros/s/AKfycbzydV2LXVIQF6p7rJpVmXXKLgEOPhHBlA4fyYa5kRhPy3NYUwsVQnQ8Rz-xqINXsHoZiA/exec" class="btn">🚀 Abrir Aplicación</a>
  </div>
</body>
</html>
