<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --color-primary: #0052cc;
    --color-primary-light: #e8f0ff;
    --color-text: #2c3e50;
    --color-text-secondary: #666666;
    --color-border: #e8e8e8;
    --color-bg: #f5f5f5;
    --color-white: #ffffff;
  }
  body { font-family: 'Inter', -apple-system, sans-serif; font-size: 0.7rem; font-weight: 400; background-color: var(--color-bg); color: var(--color-text); line-height: 1.4; }

  /* HEADER */
  .header-container { background: var(--color-white); border-bottom: 1px solid var(--color-border); padding: 10px 20px; margin-bottom: 15px; display: flex; align-items: center; gap: 16px; }
  .logo-wrapper { display: flex; align-items: center; gap: 8px; min-width: 160px; }
  .logo-wrapper svg { height: 35px; width: auto; }
  .org-name { font-size: 0.85rem; font-weight: 700; color: var(--color-primary); letter-spacing: -0.5px; }
  .org-subtitle { font-size: 0.55rem; color: var(--color-text-secondary); font-weight: 500; }
  .header-spacer { flex: 1; }
  .header-actions { display: flex; gap: 6px; align-items: center; }

  /* LAYOUT */
  .container-main { max-width: 1400px; margin: 0 auto; padding: 0 20px 20px 20px; }
  .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; gap: 12px; }
  h3.module-title { font-weight: 700; color: var(--color-text); font-size: 1.05rem; margin-bottom: 0; }
  .section-title { font-size: 0.55rem; text-transform: uppercase; font-weight: 700; color: var(--color-text-secondary); margin-bottom: 8px; letter-spacing: 0.3px; }

  /* PANELES */
  .card-panel { background: var(--color-white); border-radius: 6px; border: 1px solid var(--color-border); box-shadow: 0 1px 2px rgba(0,0,0,0.03); padding: 12px; margin-bottom: 12px; }
  .toolbar { background: var(--color-white); padding: 10px; border-radius: 6px; border: 1px solid var(--color-border); margin-bottom: 12px; }

  /* FILTROS */
  .filters-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: var(--color-bg); border-radius: 6px 6px 0 0; cursor: pointer; user-select: none; border: 1px solid var(--color-border); border-bottom: none; }
  .filters-header:hover { background: #f0f0f0; }
  .filters-content { max-height: 500px; overflow: hidden; transition: max-height 0.3s ease, padding 0.3s ease; background: var(--color-white); border: 1px solid var(--color-border); border-top: none; border-radius: 0 0 6px 6px; }
  .filters-content.collapsed { max-height: 0; padding: 0 12px; overflow: hidden; }
  .filters-content.expanded { padding: 12px; }

  /* FORMULARIOS */
  .form-control-sm, .form-select-sm { font-weight: 500; color: var(--color-text); border-color: var(--color-border); border-radius: 4px; font-size: 0.7rem; padding: 4px 8px; height: 28px; }
  .form-control-sm:focus, .form-select-sm:focus { border-color: var(--color-primary); box-shadow: 0 0 0 2px rgba(0,82,204,0.1); }
  input[type="date"] { font-family: 'Inter', sans-serif; font-weight: 500; color: var(--color-text); border-color: var(--color-border); border-radius: 4px; font-size: 0.7rem; padding: 4px 8px; height: 28px; }
  input[type="date"]:focus { border-color: var(--color-primary); box-shadow: 0 0 0 2px rgba(0,82,204,0.1); }

  /* BOTONES */
  .btn { font-weight: 600; border-radius: 4px; font-size: 0.7rem; padding: 4px 10px; border: none; cursor: pointer; transition: all 0.2s; height: 28px; display: inline-flex; align-items: center; gap: 4px; }
  .btn-outline-secondary { color: var(--color-text); border: 1px solid var(--color-border); background: var(--color-white); }
  .btn-outline-secondary:hover { background-color: var(--color-bg); border-color: var(--color-text-secondary); }
  .btn-secondary, .btn-primary { background-color: var(--color-primary); color: var(--color-white); }
  .btn-secondary:hover, .btn-primary:hover { background-color: #003d99; }
  .btn-icon { width: 24px; height: 24px; padding: 0; justify-content: center; background: none; border: none; font-size: 0.85rem; cursor: pointer; color: var(--color-primary); }
  .btn-icon:hover { color: #003d99; }
  a.btn-icon { text-decoration: none; color: var(--color-primary); }
  a.btn-icon:hover { color: #003d99; }

  /* TABLA */
  table.table { margin-bottom: 0; font-size: 0.7rem; }
  thead th { background-color: var(--color-bg); color: var(--color-text); font-size: 0.6rem; text-transform: uppercase; font-weight: 700; border: none; padding: 8px 6px; letter-spacing: 0.2px; }
  tbody tr { border-top: 1px solid #f0f0f0; }
  tbody td { font-weight: 500; color: var(--color-text); border: none; padding: 8px 6px; vertical-align: middle; font-size: 0.6rem; }

  /* ESTADOS */
  .fila-grupo-new { border-top: 2px solid var(--color-primary) !important; background-color: var(--color-primary-light) !important; }
  .fila-grupo-new td { padding-top: 10px !important; }
  .state-normal    { background-color: #c8e6c9 !important; color: #1b5e20 !important; }
  .state-pendiente { background-color: #ffe0b2 !important; color: #e65100 !important; }
  .state-desvio    { background-color: #b3e5fc !important; color: #01579b !important; }
  .state-ausente   { background-color: #ffcccc !important; color: #b71c1c !important; }
  .state-defecto   { background-color: #e0e0e0 !important; color: #424242 !important; }
  /* [2026-09-06] Estilo para resultado Desistido */
  .state-desistido { background-color: #ede9fe !important; color: #5b21b6 !important; }
  .fila-modificada { background-color: #fffacd !important; border-left: 3px solid var(--color-primary) !important; }
  .input-error     { border: 1px solid #dc3545 !important; background-color: #fff5f5 !important; }

  a.empleado-link { color: var(--color-primary); text-decoration: none; font-weight: 600; cursor: pointer; }
  a.empleado-link:hover { text-decoration: underline; }
  .adjuntos-cell { display: flex; gap: 4px; align-items: center; }

  /* BANNER Y FLOTANTE */
  #pendingBanner { display: none; position: sticky; top: 0; z-index: 100; background: #fff9e6; border: 1px solid #ffe082; border-radius: 4px; padding: 8px 10px; margin-bottom: 12px; font-weight: 600; color: #f57f17; font-size: 0.7rem; align-items: center; gap: 8px; }
  #btnGuardarTodos { position: fixed; bottom: 15px; right: 15px; border-radius: 50px; padding: 8px 14px; box-shadow: 0 2px 8px rgba(0,82,204,0.3); display: none; z-index: 1000; background-color: var(--color-primary); color: var(--color-white); font-weight: 600; border: none; cursor: pointer; font-size: 0.7rem; transition: all 0.2s; }
  #btnGuardarTodos:hover { background-color: #003d99; transform: translateY(-1px); }

  /* LOADING */
  #loadingOverlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #0b0f19;
    z-index: 99999;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transition: opacity 0.3s ease;
  }
  .loading-gif {
    max-width: 220px;
    max-height: 220px;
    border-radius: 12px;
    object-fit: cover;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    margin-bottom: 18px;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  .progress-container { width: 280px; margin-top: 14px; }
  .progress { height: 6px; border-radius: 3px; background-color: rgba(255, 255, 255, 0.15); }
  .progress-bar { background-color: var(--color-primary); transition: width 0.4s ease; }
  #loadingTip { margin-top: 14px; font-weight: 500; color: #94a3b8; min-height: 18px; font-size: 0.75rem; text-align: center; }

  /* TOAST */
  #toastContainer { position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%); z-index: 3000; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
  .toast-msg { padding: 10px 16px; border-radius: 6px; font-weight: 600; font-size: 0.75rem; color: var(--color-white); opacity: 0; transform: translateY(10px); transition: opacity 0.25s, transform 0.25s; max-width: 550px; text-align: center; pointer-events: auto; word-break: break-word; box-shadow: 0 4px 14px rgba(0,0,0,0.3); }
  .toast-msg.show { opacity: 1; transform: translateY(0); }
  .toast-success { background: #2e7d32; }
  .toast-warning { background: #f57f17; }
  .toast-error   { background: #c62828; }
  .toast-info    { background: var(--color-primary); }
</style>
