<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 260px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      text-align: center;
    }
    .icon {
      font-size: 2.2rem;
      margin-bottom: 8px;
    }
    h2 {
      font-size: 1.05rem;
      color: #38bdf8;
      margin-bottom: 6px;
    }
    p {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-bottom: 14px;
      line-height: 1.4;
    }
    .btn {
      display: block;
      width: 100%;
      background: #0284c7;
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #0369a1;
    }
  </style>
</head>
<body>
  <div class="icon">🩺</div>
  <h2>Auditoría Médica 2026</h2>
  <p>Plataforma de control y auditoría de exámenes médicos laborales.</p>
  <button id="btnAbrir" class="btn">🚀 Abrir Plataforma</button>

  <script>
    document.getElementById('btnAbrir').addEventListener('click', () => {
      chrome.tabs.create({
        url: "https://script.google.com/macros/s/AKfycbzydV2LXVIQF6p7rJpVmXXKLgEOPhHBlA4fyYa5kRhPy3NYUwsVQnQ8Rz-xqINXsHoZiA/exec"
      });
    });
  </script>
</body>
</html>
